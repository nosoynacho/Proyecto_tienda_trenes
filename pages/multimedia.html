<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contenido multimedia ferroviario de RailMarket." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />

    <title>Tienda Virtual de Trenes | Multimedia</title>
  </head>

  <body>
    <header class="header">
      <div class="header-contenido">
        <a class="logo" href="../index.html" aria-label="Ir al inicio">
          <span class="logo-icono" aria-hidden="true">🚆</span>
          <span>RailMarket</span>
        </a>

        <nav class="nav" aria-label="Navegación principal">
          <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="./productos.html">Productos</a></li>
            <li><a class="activo" href="./multimedia.html">Multimedia</a></li>
            <li><a href="./resenas.html">Reseñas</a></li>
            <li><a href="./contacto.html">Contacto</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="pagina-encabezado pagina-encabezado-oscuro">
        <p class="etiqueta">MULTIMEDIA</p>
        <h1>El mundo ferroviario en movimiento</h1>
        <p>Imágenes y video integrados directamente en la página.</p>
      </section>

      <section class="seccion multimedia">
        <div class="multimedia-contenedor">
          <figure class="multimedia-imagen">
            <img
              src="https://upload.wikimedia.org/wikipedia/commons/8/88/Shinkansen.jpg"
              alt="Conjunto de trenes Shinkansen de alta velocidad"
            />
            <figcaption>Ejemplo visual de trenes de alta velocidad.</figcaption>
          </figure>

          <div class="video-contenedor">
            <iframe
              src="https://www.youtube-nocookie.com/embed/hluWQBcQ8Mc"
              title="Video de trenes y ferrocarriles de Japón"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen
            ></iframe>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-contenido">
        <a class="logo logo-footer" href="../index.html">
          <span aria-hidden="true">🚆</span>
          <span>RailMarket</span>
        </a>

        <nav class="footer-nav" aria-label="Navegación del pie de página">
          <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="./productos.html">Productos</a></li>
            <li><a href="./resenas.html">Reseñas</a></li>
            <li><a href="./contacto.html">Contacto</a></li>
          </ul>
        </nav>
      </div>
      <p class="copyright">© 2026 RailMarket.</p>
    </footer>
  </body>
</html>
